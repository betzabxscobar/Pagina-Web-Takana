<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="TAKABLOX">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1247"/>
      <stop offset="55%" stop-color="#2a1b6b"/>
      <stop offset="100%" stop-color="#4a1f7a"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#fondo)"/>

  <!-- Rejilla del tablero -->
  <g stroke="#ffffff" stroke-opacity=".07">
    <path d="M0 90h800M0 180h800M0 270h800M0 360h800"/>
    <path d="M100 0v450M200 0v450M300 0v450M400 0v450M500 0v450M600 0v450M700 0v450"/>
  </g>

  <!-- Piezas cayendo -->
  <g rx="8">
    <rect x="86"  y="212" width="76" height="76" rx="10" fill="#30baf0"/>
    <rect x="86"  y="290" width="76" height="76" rx="10" fill="#30baf0"/>
    <rect x="164" y="290" width="76" height="76" rx="10" fill="#30baf0"/>

    <rect x="560" y="124" width="76" height="76" rx="10" fill="#e23ee4"/>
    <rect x="638" y="124" width="76" height="76" rx="10" fill="#e23ee4"/>
    <rect x="638" y="202" width="76" height="76" rx="10" fill="#e23ee4"/>

    <rect x="404" y="330" width="76" height="76" rx="10" fill="#7b41f0"/>
    <rect x="482" y="330" width="76" height="76" rx="10" fill="#7b41f0"/>
    <rect x="560" y="330" width="76" height="76" rx="10" fill="#7b41f0"/>
    <rect x="638" y="330" width="76" height="76" rx="10" fill="#19b9ee"/>

    <rect x="242" y="56" width="76" height="76" rx="10" fill="#ffc54d"/>
    <rect x="320" y="56" width="76" height="76" rx="10" fill="#ffc54d"/>
  </g>

  <rect width="800" height="230" fill="url(#brillo)"/>

  <text x="60" y="126" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="62" font-weight="800" letter-spacing="2" fill="#ffffff">TAKABLOX</text>
  <text x="62" y="162" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="19" font-weight="600" letter-spacing="5" fill="#b9a8ff">JUEGA EN EL NAVEGADOR</text>
</svg>
